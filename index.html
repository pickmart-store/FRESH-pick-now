<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loompix Store - Premium Shopping</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-50 bg-white/85 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-tight text-gray-900 bg-gradient-to-r from-emerald-600 to-teal-600 bg-clip-text text-transparent">LOOMPIX</span>
            </div>
            
            <!-- Search Bar -->
            <div class="hidden md:flex flex-1 max-w-md mx-8">
                <div class="relative w-full">
                    <input type="text" id="searchInput" placeholder="Search premium products..." class="w-full pl-10 pr-4 py-2 bg-gray-100 border-none rounded-full text-sm focus:ring-2 focus:ring-emerald-500 focus:bg-white transition-all">
                    <i class="fa-solid fa-search absolute left-4 top-3 text-gray-400 text-sm"></i>
                </div>
            </div>

            <!-- Nav Actions -->
            <div class="flex items-center space-x-5">
                <button onclick="toggleCartModal()" class="relative p-2 text-gray-700 hover:text-emerald-600 transition-colors">
                    <i class="fa-solid fa-bag-shopping text-xl"></i>
                    <span id="cartBadge" class="absolute -top-1 -right-1 bg-emerald-600 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
                <button onclick="toggleProfileModal()" class="p-2 text-gray-700 hover:text-emerald-600 transition-colors">
                    <i class="fa-regular fa-user text-xl"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Hero Banner -->
    <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="relative rounded-3xl overflow-hidden bg-gradient-to-r from-gray-900 to-emerald-950 text-white p-8 md:p-14 shadow-2xl">
            <div class="max-w-xl">
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-semibold px-3 py-1 rounded-full border border-emerald-500/30 uppercase tracking-wider">New Collection 2026</span>
                <h1 class="text-3xl md:text-5xl font-extrabold mt-4 tracking-tight leading-tight">Elevate Your Lifestyle with Premium Quality</h1>
                <p class="text-gray-300 mt-3 text-sm md:text-base">Discover handpicked items delivered straight to your doorstep with ultimate freshness & quality.</p>
                <button onclick="document.getElementById('productsSection').scrollIntoView({behavior: 'smooth'})" class="mt-6 bg-emerald-500 hover:bg-emerald-600 text-white font-medium px-6 py-3 rounded-xl shadow-lg shadow-emerald-500/30 transition-all">Shop Now</button>
            </div>
        </div>
    </section>

    <!-- Categories Bar -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <h3 class="text-lg font-bold text-gray-900 mb-4">Categories</h3>
        <div id="categoriesContainer" class="flex space-x-4 overflow-x-auto pb-2 scrollbar-hide">
            <button onclick="filterCategory('All')" class="category-btn active px-5 py-2.5 rounded-full bg-emerald-600 text-white text-sm font-medium whitespace-nowrap shadow-sm transition-all">All Items</button>
            <!-- Dynamic Categories will load here -->
        </div>
    </div>

    <!-- Products Grid Section -->
    <section id="productsSection" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <h3 class="text-xl font-bold text-gray-900 mb-6">Featured Products</h3>
        <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamic Products will load here -->
        </div>
    </section>

    <!-- Cart Modal / Drawer -->
    <div id="cartModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex justify-end">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col p-6 animate-slide-left">
            <div class="flex items-center justify-between pb-4 border-b border-gray-100">
                <h2 class="text-lg font-bold text-gray-900">Your Shopping Cart</h2>
                <button onclick="toggleCartModal()" class="text-gray-400 hover:text-gray-600"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cartItemsList" class="flex-1 overflow-y-auto py-4 space-y-4">
                <!-- Cart Items -->
            </div>
            <div class="pt-4 border-t border-gray-100">
                <div class="flex justify-between mb-4 font-bold text-lg">
                    <span>Total:</span>
                    <span id="cartTotalPrice" class="text-emerald-600">₹0</span>
                </div>
                <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-medium shadow-lg shadow-emerald-600/20 transition-all flex items-center justify-center space-x-2">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                    <span>Order via WhatsApp / COD</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Profile Modal -->
    <div id="profileModal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-lg font-bold">My Profile</h3>
                <button onclick="toggleProfileModal()" class="text-gray-400"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-500 font-medium">Name</label>
                    <input type="text" id="userName" value="Guest User" class="w-full mt-1 p-2 bg-gray-100 rounded-lg text-sm border-none">
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-medium">Phone Number</label>
                    <input type="text" id="userPhone" placeholder="+91 9876543210" class="w-full mt-1 p-2 bg-gray-100 rounded-lg text-sm border-none">
                </div>
                <div>
                    <label class="text-xs text-gray-500 font-medium">Delivery Address</label>
                    <textarea id="userAddress" placeholder="Enter full address..." class="w-full mt-1 p-2 bg-gray-100 rounded-lg text-sm border-none"></textarea>
                </div>
                <button onclick="saveProfile()" class="w-full bg-gray-900 text-white py-2.5 rounded-xl text-sm font-medium">Save Profile</button>
            </div>
        </div>
    </div>

    <!-- JavaScript for User Store Logic -->
    <script>
        // Sample Initial Data (Automatically synced with Admin panel storage)
        let categories = JSON.parse(localStorage.getItem('store_categories')) || ["Groceries", "Fashion", "Electronics"];
        let products = JSON.parse(localStorage.getItem('store_products')) || [
            { id: 1, name: "Fresh Organic Apples", category: "Groceries", unitType: "kg", minQty: 0.5, price: 180, offerPrice: 150, image: "https://images.unsplash.com/photo-1560806887-1e4cd0b6cbd6?w=500" },
            { id: 2, name: "Premium Casual T-Shirt", category: "Fashion", unitType: "piece", minQty: 1, price: 999, offerPrice: 699, image: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" }
        ];
        let cart = [];

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            let html = `<button onclick="filterCategory('All')" class="category-btn px-5 py-2.5 rounded-full bg-emerald-600 text-white text-sm font-medium whitespace-nowrap shadow-sm transition-all">All Items</button>`;
            categories.forEach(cat => {
                html += `<button onclick="filterCategory('${cat}')" class="category-btn px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition-all">${cat}</button>`;
            });
            container.innerHTML = html;
        }

        function renderProducts(filter = 'All', search = '') {
            const grid = document.getElementById('productsGrid');
            let filtered = products.filter(p => {
                let matchesCat = (filter === 'All' || p.category === filter);
                let matchesSearch = p.name.toLowerCase().includes(search.toLowerCase());
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-400">No products found.</div>`;
                return;
            }

            let html = '';
            filtered.forEach(p => {
                let displayPrice = p.offerPrice ? p.offerPrice : p.price;
                let discountBadge = p.offerPrice ? `<span class="absolute top-3 left-3 bg-red-500 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-md">Sale</span>` : '';
                
                let qtyOptions = '';
                if(p.unitType === 'kg') {
                    qtyOptions = `<div class="flex items-center space-x-2 my-3">
                        <span class="text-xs text-gray-500">Qty (Kg):</span>
                        <input type="number" id="qty_${p.id}" value="${p.minQty}" min="${p.minQty}" step="0.5" class="w-20 p-1.5 border rounded-lg text-center text-sm">
                    </div>`;
                } else {
                    qtyOptions = `<div class="flex items-center space-x-2 my-3">
                        <span class="text-xs text-gray-500">Pieces:</span>
                        <input type="number" id="qty_${p.id}" value="${p.minQty || 1}" min="1" step="1" class="w-20 p-1.5 border rounded-lg text-center text-sm">
                    </div>`;
                }

                html += `
                    <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex flex-col justify-between relative hover:shadow-xl transition-all duration-300">
                        ${discountBadge}
                        <div class="h-48 rounded-xl overflow-hidden bg-gray-100 mb-4">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                        </div>
                        <div>
                            <span class="text-xs text-emerald-600 font-semibold uppercase tracking-wider">${p.category}</span>
                            <h4 class="font-bold text-gray-900 mt-1">${p.name}</h4>
                            <div class="flex items-center space-x-2 mt-2">
                                <span class="text-lg font-black text-gray-900">₹${displayPrice}</span>
                                ${p.offerPrice ? `<span class="text-sm text-gray-400 line-through">₹${p.price}</span>` : ''}
                            </div>
                            ${qtyOptions}
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-gray-900 hover:bg-emerald-600 text-white py-2.5 rounded-xl text-sm font-medium transition-colors flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-cart-plus"></i>
                            <span>Add to Cart</span>
                        </button>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function filterCategory(cat) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                if(btn.textContent.includes(cat) || (cat === 'All' && btn.textContent === 'All Items')) {
                    btn.className = "category-btn px-5 py-2.5 rounded-full bg-emerald-600 text-white text-sm font-medium whitespace-nowrap shadow-sm transition-all";
                } else {
                    btn.className = "category-btn px-5 py-2.5 rounded-full bg-white text-gray-700 border border-gray-200 text-sm font-medium whitespace-nowrap hover:bg-gray-100 transition-all";
                }
            });
            renderProducts(cat, document.getElementById('searchInput').value);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts('All', e.target.value);
        });

        function addToCart(productId) {
            let product = products.find(p => p.id === productId);
            let qtyInput = document.getElementById(`qty_${productId}`);
            let qty = parseFloat(qtyInput.value) || 1;
            
            let existing = cart.find(item => item.id === productId);
            if(existing) {
                existing.qty += qty;
            } else {
                cart.push({ ...product, qty });
            }
            updateCartUI();
            toggleCartModal();
        }

        function updateCartUI() {
            document.getElementById('cartBadge').innerText = cart.reduce((sum, item) => sum + 1, 0);
            let list = document.getElementById('cartItemsList');
            let totalPrice = 0;

            if(cart.length === 0) {
                list.innerHTML = `<p class="text-gray-400 text-center py-8">Your cart is empty.</p>`;
                document.getElementById('cartTotalPrice').innerText = '₹0';
                return;
            }

            let html = '';
            cart.forEach((item, index) => {
                let price = item.offerPrice ? item.offerPrice : item.price;
                let itemTotal = price * item.qty;
                totalPrice += itemTotal;

                html += `
                    flex items-center justify-between bg-gray-50 p-3 rounded-xl">
                        <div class="flex items-center space-x-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded-lg">
                            <div>
                                <h5 class="font-bold text-sm text-gray-900">${item.name}</h5>
                                <p class="text-xs text-gray-500">Qty: ${item.qty} ${item.unitType}</p>
                                <p class="text-xs font-bold text-emerald-600">₹${itemTotal.toFixed(2)}</p>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-red-500 hover:text-red-700 text-sm"><i class="fa-solid fa-trash"></i></button>
                    </div>
                `;
            });
            list.innerHTML = html;
            document.getElementById('cartTotalPrice').innerText = `₹${totalPrice.toFixed(2)}`;
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCartModal() {
            let modal = document.getElementById('cartModal');
            modal.classList.toggle('hidden');
        }

        function toggleProfileModal() {
            let modal = document.getElementById('profileModal');
            modal.classList.toggle('hidden');
        }

        function saveProfile() {
            alert('Profile saved successfully!');
            toggleProfileModal();
        }

        function checkoutWhatsApp() {
            if(cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            let name = document.getElementById('userName').value;
            let phone = document.getElementById('userPhone').value;
            let address = document.getElementById('userAddress').value;

            let msg = `*New Order Received*%0A*Name:* ${name}%0A*Phone:* ${phone}%0A*Address:* ${address}%0A%0A*Items:*%0A`;
            let total = 0;
            cart.forEach(item => {
                let price = item.offerPrice ? item.offerPrice : item.price;
                msg += `- ${item.name} (${item.qty} ${item.unitType}) : ₹${price * item.qty}%0A`;
                total += price * item.qty;
            });
            msg += `%0A*Total Amount: ₹${total}*`;

            // Replace with your store owner WhatsApp number
            let ownerPhone = "919876543210"; 
            window.open(`https://wa.me/${ownerPhone}?text=${msg}`, '_blank');
        }

        // Initial Load
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
