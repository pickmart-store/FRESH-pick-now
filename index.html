<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Mart - Online Grocery Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #0d9488;
            --primary-dark: #0f766e;
            --bg-light: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #e5e7eb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 870px;
            background-color: #f8fafc;
            border-radius: 35px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.15);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            border: 8px solid #333;
        }

        /* Top Status Bar */
        .status-bar {
            height: 35px;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
            background: #fff;
        }

        .screen {
            display: none;
            flex: 1;
            overflow-y: auto;
            padding-bottom: 70px;
        }

        .screen.active {
            display: block;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 65px;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #e5e7eb;
            z-index: 10;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11px;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .nav-item.active {
            color: var(--primary-color);
        }

        .cart-badge {
            position: absolute;
            top: -5px;
            right: -8px;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            width: 100%;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        /* Home Page Elements */
        .header-location {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }
        .search-box {
            margin: 10px 20px;
            padding: 10px 15px;
            background: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }
        .search-box input {
            border: none;
            outline: none;
            width: 100%;
        }
        .banner {
            margin: 10px 20px;
            background: #ccfbf1;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding: 10px 20px;
        }
        .product-card {
            background: #fff;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
            position: relative;
        }
        .product-card img {
            width: 100%;
            height: 70px;
            object-fit: contain;
            border-radius: 8px;
        }

        /* Categories Page */
        .cat-item {
            background: #fff;
            margin: 10px 20px;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .cat-item img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        /* Admin Styles */
        .admin-form {
            padding: 20px;
            background: #fff;
            margin: 15px;
            border-radius: 12px;
        }
        .admin-form input, .admin-form select {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="mobile-container">
    <!-- Status Bar -->
    <div class="status-bar">
        <span>9:41</span>
        <div>
            <i class="fas fa-signal"></i>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-full"></i>
        </div>
    </div>

    <!-- HOME PAGE -->
    <div id="p-home" class="screen active">
        <div class="header-location">
            <div><i class="fas fa-map-marker-alt" style="color: var(--primary-color);"></i> Deliver to <b>Home - 123 Green St</b></div>
            <i class="far fa-bell"></i>
        </div>
        <div class="search-box">
            <i class="fas fa-search" style="color: #9ca3af;"></i>
            <input type="text" placeholder="Search for products...">
        </div>
        <div class="banner">
            <div>
                <h3 style="color: #0f766e;">Fresh Vegetables</h3>
                <p style="font-size: 12px; color: #0f766e;">Up to 30% Off</p>
                <button style="background: var(--primary-color); color: #fff; border:none; padding: 5px 12px; border-radius: 15px; margin-top: 5px; font-size: 11px;">Shop Now →</button>
            </div>
            <img src="https://cdn-icons-png.flaticon.com/512/2153/2153788.png" width="80">
        </div>

        <div style="padding: 10px 20px; font-weight: bold;">Flash Deals ⚡</div>
        <div class="products-grid" id="products-list">
            <!-- Dynamic Products will load here from Admin/JS -->
        </div>
    </div>

    <!-- CATEGORIES PAGE -->
    <div id="p-categories" class="screen">
        <h3 style="padding: 15px 20px; text-align: center;">Categories</h3>
        <div class="cat-item">
            <img src="https://cdn-icons-png.flaticon.com/512/1625/1625048.png">
            <div>
                <b>Fruits & Vegetables</b><br>
                <small style="color: var(--text-sub);">Fresh and Organic</small>
            </div>
        </div>
        <div class="cat-item">
            <img src="https://cdn-icons-png.flaticon.com/512/3050/3050158.png">
            <div>
                <b>Dairy & Eggs</b><br>
                <small style="color: var(--text-sub);">Fresh Products</small>
            </div>
        </div>
    </div>

    <!-- CART PAGE -->
    <div id="p-cart" class="screen">
        <h3 style="padding: 15px 20px; text-align: center;">My Cart</h3>
        <div style="padding: 20px; text-align: center;" id="cart-items">
            <p>Your cart is empty!</p>
        </div>
    </div>

    <!-- ADMIN PANEL (Manage Products & Photos) -->
    <div id="p-admin" class="screen">
        <h3 style="padding: 15px 20px; text-align: center;">Admin Panel (Manage Store)</h3>
        <div class="admin-form">
            <h4>Add New Product / Change Photo</h4>
            <input type="text" id="prod-name" placeholder="Product Name (e.g. Avocado)">
            <input type="text" id="prod-price" placeholder="Price (e.g. $3.45)">
            <input type="text" id="prod-img" placeholder="Image URL (Image Link)">
            <button class="btn-primary" onclick="addProduct()" style="margin-top: 10px;">Save Product</button>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showScreen('p-home', this)">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="showScreen('p-categories', this)">
            <i class="fas fa-th-large"></i>
            <span>Categories</span>
        </div>
        <div class="nav-item" style="position: relative;" onclick="showScreen('p-cart', this)">
            <i class="fas fa-shopping-cart"></i>
            <span class="cart-badge">0</span>
            <span>Cart</span>
        </div>
        <div class="nav-item" onclick="showScreen('p-admin', this)">
            <i class="fas fa-user-cog"></i>
            <span>Admin</span>
        </div>
    </div>
</div>

<script>
    // Default initial products
    let defaultProducts = [
        { name: 'Banana', price: '$1.25', img: 'https://cdn-icons-png.flaticon.com/512/3137/3137044.png' },
        { name: 'Red Apple', price: '$2.45', img: 'https://cdn-icons-png.flaticon.com/512/415/415733.png' },
        { name: 'Orange', price: '$1.85', img: 'https://cdn-icons-png.flaticon.com/512/1728/1728729.png' }
    ];

    // Load products from localStorage or defaults
    function getProducts() {
        let stored = localStorage.getItem('freshmart_products');
        return stored ? JSON.parse(stored) : defaultProducts;
    }

    // Render Products to Home Screen
    function renderProducts() {
        const list = document.getElementById('products-list');
        list.innerHTML = '';
        let products = getProducts();

        products.forEach(p => {
            list.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <p style="font-size: 12px; font-weight: bold; margin-top:5px;">${p.name}</p>
                    <p style="font-size: 11px; color: var(--primary-color); font-weight:600;">${p.price}</p>
                </div>
            `;
        });
    }

    // Add Product from Admin Panel
    function addProduct() {
        let name = document.getElementById('prod-name').value;
        let price = document.getElementById('prod-price').value;
        let img = document.getElementById('prod-img').value;

        if(!name || !price || !img) {
            alert('Please fill all details and Image URL!');
            return;
        }

        let products = getProducts();
        products.push({ name, price, img });
        localStorage.setItem('freshmart_products', JSON.stringify(products));

        alert('New Product & Photo Added Successfully!');
        document.getElementById('prod-name').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-img').value = '';

        renderProducts();
    }

    // Switch Screens
    function showScreen(screenId, element) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

        document.getElementById(screenId).classList.add('active');
        element.classList.add('active');
    }

    // Initial Render
    renderProducts();
</script>

</body>
</html>
