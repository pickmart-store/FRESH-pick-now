<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Store - Online Grocery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #059669;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --subtext: #64748b;
            --danger: #ef4444;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #020617; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .app-container {
            width: 100%; max-width: 430px; height: 880px; background-color: var(--bg);
            border-radius: 35px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            overflow: hidden; position: relative; display: flex; flex-direction: column;
            border: 8px solid #1e293b;
        }

        .header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
        .screen { display: none; flex: 1; overflow-y: auto; padding: 15px; padding-bottom: 90px; }
        .screen.active { display: block; }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 70px; background: #ffffff; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--subtext); font-size: 11px; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
        .nav-item i { font-size: 18px; margin-bottom: 3px; }

        .search-box { background: #fff; padding: 10px 15px; border-radius: 12px; display: flex; gap: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        .search-box input { border: none; outline: none; width: 100%; }

        .category-scroll { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; }
        .cat-chip { background: #fff; padding: 8px 16px; border-radius: 20px; white-space: nowrap; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid #e2e8f0; }
        .cat-chip.active { background: var(--primary); color: white; border-color: var(--primary); }

        .products-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .product-card { background: #fff; border-radius: 15px; padding: 12px; border: 1px solid #e2e8f0; display: flex; flex-direction: column; justify-content: space-between; }
        .product-card img { width: 100%; height: 100px; object-fit: contain; margin-bottom: 8px; }
        
        .stock-tag { font-size: 10px; font-weight: bold; padding: 2px 6px; border-radius: 4px; display: inline-block; margin-top: 3px; }
        .in-stock { background: #d1fae5; color: #047857; }
        .out-stock { background: #fee2e2; color: #b91c1c; }

        .btn-add { background: var(--primary); color: white; border: none; padding: 8px; border-radius: 8px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
        .btn-add:disabled { background: #cbd5e1; cursor: not-allowed; }

        .cart-item { background: #fff; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; border: 1px solid #e2e8f0; }
        .qty-btn { background: #f1f5f9; border: none; width: 25px; height: 25px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        
        .pay-banner { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; padding: 10px; border-radius: 10px; font-size: 12px; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div>
            <small style="color: var(--subtext); font-size: 11px;">Welcome 👋</small>
            <b id="user-display-name" style="display: block; font-size: 14px;">Guest User</b>
        </div>
        <i class="fas fa-user-circle" style="font-size: 24px; color: var(--primary); cursor: pointer;" onclick="showScreen('screen-login')"></i>
    </div>

    <!-- SHOP SCREEN -->
    <div id="screen-home" class="screen active">
        <div class="search-box">
            <i class="fas fa-search" style="color: var(--subtext);"></i>
            <input type="text" id="search-input" placeholder="Search products..." onkeyup="filterProducts()">
        </div>

        <div class="category-scroll" id="category-bar"></div>
        <div class="products-grid" id="products-list"></div>
    </div>

    <!-- CART SCREEN -->
    <div id="screen-cart" class="screen">
        <h3 style="margin-bottom: 15px;">Shopping Cart</h3>
        <div id="cart-items-container"></div>

        <div id="cart-summary" style="display: none; background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; margin-top: 15px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px;">
                <span>Total Amount</span><b id="total-val">₹0</b>
            </div>
            <div class="pay-banner">
                <i class="fas fa-lock"></i> <b>Online Payment Only</b> (COD Disabled)
            </div>
            <button class="btn-submit" onclick="processOnlinePayment()">Pay Online & Place Order</button>
        </div>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="screen-login" class="screen">
        <div style="background: #fff; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0;">
            <h3 style="margin-bottom: 10px;">Customer Registration</h3>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="login-name">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="login-phone">
            </div>
            <div class="form-group">
                <label>Delivery Address</label>
                <input type="text" id="login-address">
            </div>
            <button class="btn-submit" onclick="saveCustomerLogin()">Save Details</button>
        </div>
    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="showScreen('screen-home', this)"><i class="fas fa-store"></i><span>Shop</span></div>
        <div class="nav-item" onclick="showScreen('screen-cart', this)"><i class="fas fa-shopping-basket"></i><span>Cart (<b id="cart-count">0</b>)</span></div>
        <div class="nav-item" onclick="showScreen('screen-login', this)"><i class="fas fa-user"></i><span>Account</span></div>
    </div>
</div>

<script>
    let categories = JSON.parse(localStorage.getItem('fm_categories')) || ['All', 'Vegetables', 'Grocery', 'Fruits'];
    let products = JSON.parse(localStorage.getItem('fm_products')) || [];
    let cart = JSON.parse(localStorage.getItem('fm_cart')) || [];
    let selectedCategory = 'All';

    window.onload = function() {
        checkUserLogin();
        renderCategories();
        renderProducts();
        updateCartUI();
    };

    function showScreen(screenId, navEl) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        if(navEl) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            navEl.classList.add('active');
        }
    }

    function checkUserLogin() {
        let user = JSON.parse(localStorage.getItem('fm_user'));
        if(user && user.name) {
            document.getElementById('user-display-name').innerText = user.name;
            document.getElementById('login-name').value = user.name;
            document.getElementById('login-phone').value = user.phone || '';
            document.getElementById('login-address').value = user.address || '';
        }
    }

    function saveCustomerLogin() {
        let name = document.getElementById('login-name').value;
        let phone = document.getElementById('login-phone').value;
        let address = document.getElementById('login-address').value;
        if(!name || !phone || !address) return alert('All details required.');

        localStorage.setItem('fm_user', JSON.stringify({ name, phone, address }));
        checkUserLogin();
        alert('Details saved!');
        showScreen('screen-home');
    }

    function renderCategories() {
        categories = JSON.parse(localStorage.getItem('fm_categories')) || ['All', 'Vegetables', 'Grocery'];
        const catContainer = document.getElementById('category-bar');
        catContainer.innerHTML = '';
        categories.forEach(cat => {
            let activeClass = cat === selectedCategory ? 'active' : '';
            catContainer.innerHTML += `<div class="cat-chip ${activeClass}" onclick="selectCategory('${cat}')">${cat}</div>`;
        });
    }

    function selectCategory(cat) { selectedCategory = cat; renderCategories(); renderProducts(); }

    function renderProducts() {
        products = JSON.parse(localStorage.getItem('fm_products')) || [];
        const grid = document.getElementById('products-list');
        grid.innerHTML = '';

        let filtered = products.filter(p => selectedCategory === 'All' || p.category === selectedCategory);
        if(filtered.length === 0) {
            grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#64748b; padding: 20px;">No products available.</p>';
            return;
        }

        filtered.forEach(p => {
            let isOut = p.stock <= 0;
            grid.innerHTML += `
                <div class="product-card">
                    <img src="${p.img || 'https://via.placeholder.com/100'}" alt="${p.name}">
                    <div style="font-size:13px; font-weight:bold;">${p.name}</div>
                    <div style="font-size:11px; color:#64748b;">${p.unit}</div>
                    <div style="font-size:14px; font-weight:bold; color:#059669;">₹${p.price}</div>
                    <div><span class="stock-tag ${isOut ? 'out-stock' : 'in-stock'}">${isOut ? 'Out of Stock' : 'Stock: ' + p.stock}</span></div>
                    <button class="btn-add" onclick="addToCart(${p.id})" ${isOut ? 'disabled' : ''}>${isOut ? 'Unavailable' : 'Add to Cart'}</button>
                </div>
            `;
        });
    }

    function filterProducts() {
        let q = document.getElementById('search-input').value.toLowerCase();
        document.querySelectorAll('.product-card').forEach((card, idx) => {
            card.style.display = products[idx] && products[idx].name.toLowerCase().includes(q) ? 'flex' : 'none';
        });
    }

    function addToCart(pId) {
        let prod = products.find(p => p.id === pId);
        if(!prod || prod.stock <= 0) return;
        let item = cart.find(i => i.id === pId);
        if(item) {
            if(item.qty < prod.stock) item.qty++;
            else alert('Stock limit reached!');
        } else {
            cart.push({ id: prod.id, name: prod.name, price: prod.price, unit: prod.unit, img: prod.img, qty: 1 });
        }
        saveCart();
    }

    function updateQty(pId, change) {
        let item = cart.find(i => i.id === pId);
        let prod = products.find(p => p.id === pId);
        if(item) {
            item.qty += change;
            if(item.qty > prod.stock) item.qty = prod.stock;
            if(item.qty <= 0) cart = cart.filter(i => i.id !== pId);
        }
        saveCart();
    }

    function saveCart() {
        localStorage.setItem('fm_cart', JSON.stringify(cart));
        updateCartUI();
    }

    function updateCartUI() {
        const container = document.getElementById('cart-items-container');
        const summary = document.getElementById('cart-summary');
        container.innerHTML = '';
        let total = 0, count = 0;

        if(cart.length === 0) {
            container.innerHTML = '<p style="text-align:center; color:#64748b; padding: 20px;">Cart is empty.</p>';
            summary.style.display = 'none';
            document.getElementById('cart-count').innerText = 0;
            return;
        }

        cart.forEach(item => {
            total += item.price * item.qty;
            count += item.qty;
            container.innerHTML += `
                <div class="cart-item">
                    <img src="${item.img}" width="40">
                    <div style="flex:1;">
                        <b>${item.name}</b><br><small>₹${item.price} / ${item.unit}</small>
                    </div>
                    <div>
                        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                        <b style="margin:0 5px;">${item.qty}</b>
                        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                    </div>
                </div>
            `;
        });

        document.getElementById('total-val').innerText = '₹' + total;
        document.getElementById('cart-count').innerText = count;
        summary.style.display = 'block';
    }

    function processOnlinePayment() {
        let user = JSON.parse(localStorage.getItem('fm_user'));
        if(!user || !user.name) return alert('Please complete your account login before checking out.');

        products.forEach(p => {
            let item = cart.find(c => c.id === p.id);
            if(item) p.stock -= item.qty;
        });

        localStorage.setItem('fm_products', JSON.stringify(products));
        alert(`Payment Successful! 🎉\n\nOrder placed for ${user.name}`);
        cart = [];
        saveCart();
        renderProducts();
        showScreen('screen-home');
    }
</script>
</body>
</html>
