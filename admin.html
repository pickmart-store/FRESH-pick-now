<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Fresh Store</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { var(--primary): #059669; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f1f5f9; padding: 20px; color: #0f172a; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; border: 1px solid #cbd5e1; margin-bottom: 20px; }
        h2, h3 { margin-bottom: 15px; color: #059669; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
        .btn { background: #059669; color: #fff; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-danger { background: #ef4444; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 13px; }
        th { background: #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-cog"></i> Fresh Store Admin Dashboard</h2>

    <!-- ADD CATEGORY -->
    <div class="card">
        <h3>1. Add New Category</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="cat-input" placeholder="e.g. Vegetables, Grocery, Drinks" style="flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px;">
            <button class="btn" onclick="addCategory()">Save Category</button>
        </div>
    </div>

    <!-- ADD PRODUCT -->
    <div class="card">
        <h3>2. Add New Product</h3>
        <div class="form-group">
            <label>Category</label>
            <select id="prod-category"></select>
        </div>
        <div class="form-group">
            <label>Product Name</label>
            <input type="text" id="prod-name" placeholder="e.g. Tomato, Rice">
        </div>
        <div class="form-group">
            <label>Product Image Link (URL)</label>
            <input type="text" id="prod-img" placeholder="Paste image web URL">
        </div>
        <div class="form-group">
            <label>Measurement Unit (e.g., 250g, 500g, 1 Kg, 1 Pc)</label>
            <input type="text" id="prod-unit" placeholder="e.g. 500g or 1 Kg">
        </div>
        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number" id="prod-price" placeholder="Enter price in ₹">
        </div>
        <div class="form-group">
            <label>Stock Count</label>
            <input type="number" id="prod-stock" placeholder="Initial stock quantity">
        </div>
        <button class="btn" onclick="addProduct()">Add Product to Store</button>
    </div>

    <!-- MANAGE PRODUCTS LIST -->
    <div class="card">
        <h3>3. Current Inventory & Stock List</h3>
        <table>
            <thead>
                <tr>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Unit</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="inventory-table"></tbody>
        </table>
    </div>
</div>

<script>
    let categories = JSON.parse(localStorage.getItem('fm_categories')) || ['Vegetables', 'Grocery', 'Fruits'];
    let products = JSON.parse(localStorage.getItem('fm_products')) || [];

    window.onload = function() {
        loadCategoryDropdown();
        renderInventoryTable();
    };

    function loadCategoryDropdown() {
        const select = document.getElementById('prod-category');
        select.innerHTML = '';
        categories.forEach(c => {
            if(c !== 'All') select.innerHTML += `<option value="${c}">${c}</option>`;
        });
    }

    function addCategory() {
        let name = document.getElementById('cat-input').value.trim();
        if(name && !categories.includes(name)) {
            categories.push(name);
            localStorage.setItem('fm_categories', JSON.stringify(categories));
            loadCategoryDropdown();
            document.getElementById('cat-input').value = '';
            alert('Category Added!');
        }
    }

    function addProduct() {
        let category = document.getElementById('prod-category').value;
        let name = document.getElementById('prod-name').value;
        let img = document.getElementById('prod-img').value;
        let unit = document.getElementById('prod-unit').value;
        let price = parseFloat(document.getElementById('prod-price').value);
        let stock = parseInt(document.getElementById('prod-stock').value);

        if(!name || isNaN(price) || !unit || isNaN(stock)) {
            alert('Please complete all product fields.');
            return;
        }

        let newProd = {
            id: Date.now(),
            name, category, price, unit, stock,
            img: img || 'https://via.placeholder.com/100'
        };

        products.push(newProd);
        localStorage.setItem('fm_products', JSON.stringify(products));
        renderInventoryTable();
        alert('Product successfully added to the main store!');

        document.getElementById('prod-name').value = '';
        document.getElementById('prod-img').value = '';
        document.getElementById('prod-unit').value = '';
        document.getElementById('prod-price').value = '';
        document.getElementById('prod-stock').value = '';
    }

    function deleteProduct(id) {
        if(confirm('Are you sure you want to delete this product?')) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('fm_products', JSON.stringify(products));
            renderInventoryTable();
        }
    }

    function renderInventoryTable() {
        const table = document.getElementById('inventory-table');
        table.innerHTML = '';
        products.forEach(p => {
            table.innerHTML += `
                <tr>
                    <td><img src="${p.img}" width="35" height="35" style="object-fit:contain;"></td>
                    <td><b>${p.name}</b></td>
                    <td>${p.category}</td>
                    <td>${p.unit}</td>
                    <td>₹${p.price}</td>
                    <td><b>${p.stock}</b></td>
                    <td><button class="btn btn-danger" onclick="deleteProduct(${p.id})">Delete</button></td>
                </tr>
            `;
        });
    }
</script>

</body>
</html>
